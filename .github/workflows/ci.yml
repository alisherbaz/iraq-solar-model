name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional: run smoke tests against a deployed URL (e.g. https://your-site.netlify.app)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (model maths)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile)
        if: ${{ !inputs.base_url }}
        run: npm run test:e2e
      - name: Smoke tests against deployed site
        if: ${{ inputs.base_url }}
        run: npm run test:smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
